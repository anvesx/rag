# docker compose up --build   (from apps/rag; export RAG_AUTH_SECRET and RAG_AUDIT_KEY first, 32+ characters each)
services:
  rag:
    build:
      context: ../..
      dockerfile: apps/rag/Dockerfile
    environment:
      RAG_HOST: 0.0.0.0
      RAG_PORT: "3000"
      RAG_DATA_DIR: /data
      RAG_AUTH_SECRET: ${RAG_AUTH_SECRET:?set RAG_AUTH_SECRET}
      RAG_AUDIT_KEY: ${RAG_AUDIT_KEY:?set RAG_AUDIT_KEY}
      # Host header values include the port; add your public name here.
      RAG_ALLOWED_HOSTS: ${RAG_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
      # Set RAG_FOLDER_ROOT and RAG_TENANT (and mount the folder) to serve real documents instead of the demo.
      RAG_DEMO: "1"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    volumes:
      - rag-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  rag-data:
